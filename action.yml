name: 'dead-deps-gauge'
description: 'Find declared dependencies never imported, and imports missing from package.json'
author: 'Louis Wright'
branding: { icon: 'package', color: 'blue' }
inputs:
  path: { description: 'Project directory (default: repository root)', default: '.' }
  ignore: { description: 'Comma-separated path globs to skip', default: '' }
  fail-on: { description: 'critical | high | medium | low | info | none', default: 'high' }
  config: { description: 'Path to JSON config file', default: '' }
  sarif: { description: 'Write SARIF to this path', default: '' }
  json: { description: 'Write JSON report to this path', default: '' }
  job-summary: { description: 'Write the Markdown report to the job summary (true/false)', default: 'true' }
  args: { description: 'Extra CLI arguments', default: '' }
outputs:
  markdown-file: { description: 'Path of the Markdown report', value: '${{ steps.run.outputs.markdown-file }}' }
runs:
  using: 'composite'
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with: { node-version: '20' }
    - id: run
      shell: bash
      env:
        DD_PATH: ${{ inputs.path }}
        DD_IGNORE: ${{ inputs.ignore }}
        DD_FAIL_ON: ${{ inputs.fail-on }}
        DD_CONFIG: ${{ inputs.config }}
        DD_SARIF: ${{ inputs.sarif }}
        DD_JSON: ${{ inputs.json }}
        DD_SUMMARY: ${{ inputs.job-summary }}
        DD_ARGS: ${{ inputs.args }}
        DD_BIN: ${{ github.action_path }}/bin/dead-deps-gauge.js
      run: |
        md="$RUNNER_TEMP/dead-deps-gauge.md"
        args=("$DD_PATH" --fail-on "$DD_FAIL_ON" --markdown "$md")
        [ -n "$DD_IGNORE" ] && args+=(--ignore "$DD_IGNORE")
        [ -n "$DD_CONFIG" ] && args+=(--config "$DD_CONFIG")
        [ -n "$DD_SARIF" ] && args+=(--sarif "$DD_SARIF")
        [ -n "$DD_JSON" ] && args+=(--json "$DD_JSON")
        set +e
        # shellcheck disable=SC2086
        node "$DD_BIN" "${args[@]}" $DD_ARGS
        code=$?
        set -e
        echo "markdown-file=$md" >> "$GITHUB_OUTPUT"
        if [ "$DD_SUMMARY" = "true" ] && [ -f "$md" ]; then cat "$md" >> "$GITHUB_STEP_SUMMARY"; fi
        exit $code
